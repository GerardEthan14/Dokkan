app = "dokkan-collection-manager"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"

[[mounts]]
  source = "dokkan_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
